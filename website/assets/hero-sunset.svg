<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Phone face-down on a beach at sunset while old posts drift away</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3E7F"/>
      <stop offset="0.5" stop-color="#FF9F1C"/>
      <stop offset="0.72" stop-color="#FFD23F"/>
    </linearGradient>
    <g id="bubble">
      <rect x="-190" y="-130" width="380" height="260" rx="105"/>
      <path d="M-128 88 L-176 196 L-30 122 Z"/>
    </g>
    <g id="tuft">
      <path d="M0 0 L14 -70 L26 0 L40 -96 L54 0 L66 -62 L80 0 Z"/>
    </g>
  </defs>

  <!-- sky and sun -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1010" cy="600" r="210" fill="#FFF4E0" opacity="0.9"/>
  <g stroke="#FFF4E0" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M150 170 h90 M190 200 h120"/>
    <path d="M620 110 h70 M650 138 h110"/>
  </g>

  <!-- sea -->
  <path d="M0 600 C 200 570 400 630 600 600 S 1000 570 1200 600 S 1500 630 1600 600 V900 H0 Z" fill="#00B4C6"/>
  <g stroke="#FFF4E0" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M240 640 h140 M820 632 h220 M1300 648 h120 M560 676 h100"/>
  </g>

  <!-- beach -->
  <path d="M0 712 C 380 660 860 742 1600 690 V900 H0 Z" fill="#FFE3B3"/>
  <path d="M0 790 C 420 750 980 820 1600 770 V900 H0 Z" fill="#FFD89A" opacity="0.6"/>

  <!-- palm silhouette -->
  <g fill="#1B2A49">
    <path d="M232 760 Q 236 500 330 268 L 354 276 Q 278 500 284 760 Z"/>
    <path d="M340 270 Q 470 210 570 330 Q 460 268 340 286 Z"/>
    <path d="M340 270 Q 210 210 110 330 Q 220 268 340 286 Z"/>
    <path d="M340 268 Q 420 130 560 146 Q 430 176 346 282 Z"/>
    <path d="M340 268 Q 250 130 120 156 Q 250 186 334 282 Z"/>
    <path d="M342 274 Q 460 300 510 440 Q 420 330 340 290 Z"/>
    <path d="M338 274 Q 220 300 180 440 Q 260 330 340 290 Z"/>
    <circle cx="330" cy="292" r="16"/>
    <circle cx="356" cy="296" r="14"/>
  </g>

  <!-- grass -->
  <g fill="#2EC27E">
    <use href="#tuft" transform="translate(120 830) scale(1.3)"/>
    <use href="#tuft" transform="translate(420 800)"/>
    <use href="#tuft" transform="translate(700 850) scale(1.5)"/>
    <use href="#tuft" transform="translate(1420 812) scale(1.2)"/>
  </g>
  <g fill="#8EE0AE">
    <use href="#tuft" transform="translate(160 836) scale(0.8)"/>
    <use href="#tuft" transform="translate(760 856) scale(0.9)"/>
    <use href="#tuft" transform="translate(1460 818) scale(0.7)"/>
  </g>

  <!-- phone, face down, having a rest -->
  <g transform="translate(1130 800) rotate(-72) scale(0.75)">
    <ellipse cx="10" cy="6" rx="70" ry="104" fill="#C9A26B" opacity="0.35"/>
    <rect x="-55" y="-95" width="110" height="190" rx="24" fill="#1B2A49"/>
    <rect x="-42" y="-82" width="48" height="48" rx="13" fill="#2E4170"/>
    <circle cx="-29" cy="-69" r="8" fill="#0E1730"/>
    <circle cx="-29" cy="-47" r="8" fill="#0E1730"/>
    <circle cx="-7" cy="-58" r="5" fill="#FFF4E0" opacity="0.7"/>
  </g>
  <g fill="#1B2A49" opacity="0.6" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="30">
    <text x="1210" y="738">z</text>
    <text x="1236" y="712" font-size="24">z</text>
  </g>

  <!-- old posts, drifting away -->
  <g fill="#FFFFFF">
    <use href="#bubble" transform="translate(1250 600) rotate(-12) scale(0.22)" opacity="0.95"/>
    <use href="#bubble" transform="translate(1340 470) rotate(8) scale(0.17)" opacity="0.85"/>
    <use href="#bubble" transform="translate(1440 350) rotate(-18) scale(0.13)" opacity="0.7"/>
    <use href="#bubble" transform="translate(1500 245) rotate(10) scale(0.1)" opacity="0.55"/>
    <use href="#bubble" transform="translate(1545 165) rotate(-6) scale(0.07)" opacity="0.4"/>
  </g>
  <g>
    <rect x="1290" y="540" width="16" height="16" rx="3" fill="#FFD23F" transform="rotate(20 1298 548)"/>
    <circle cx="1395" cy="420" r="7" fill="#2EC27E"/>
    <rect x="1480" y="300" width="20" height="9" rx="4.5" fill="#00B4C6" transform="rotate(-30 1490 304)"/>
    <circle cx="1530" cy="210" r="5" fill="#FFF4E0"/>
  </g>
</svg>
